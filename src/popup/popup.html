<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Original Audio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>YouTube Original Audio</h1>
        <p class="subtitle">Prefer original tracks only for languages you choose.</p>
      </header>

      <label class="toggle-row" for="enabled">
        <span>Enable extension</span>
        <input id="enabled" type="checkbox" />
      </label>

      <section class="languages" aria-labelledby="languages-heading">
        <h2 id="languages-heading">Preferred original languages</h2>
        <p class="hint">
          Switch to original only when the video’s original language is checked (for example
          <strong>Hindi original</strong>).
        </p>
        <div id="language-list" class="language-list"></div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
