<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Original Audio</title>
    <style>
      /* Inline so it applies before paint; hide unthemeable host scrollbars. */
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="frame">
      <header class="hero">
        <p class="eyebrow">YouTube</p>
        <h1>Original Audio</h1>
        <p class="lede">Hear the real track when you already speak it.</p>
      </header>

      <label class="power" for="enabled">
        <span>
          <span class="power-kicker">Power</span>
          <span id="enabled-label" class="power-state">On</span>
        </span>
        <span class="switch">
          <input id="enabled" type="checkbox" role="switch" />
          <span class="switch-ui" aria-hidden="true"></span>
        </span>
      </label>

      <section class="langs" aria-labelledby="languages-heading">
        <div class="langs-head">
          <h2 id="languages-heading">Languages</h2>
        </div>
        <label class="search" for="language-search">
          <span class="visually-hidden">Search languages</span>
          <input
            id="language-search"
            type="search"
            placeholder="Find a language"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <div class="lang-scroll">
          <div id="language-list" class="lang-list" role="list"></div>
          <div class="lang-rail" aria-hidden="true">
            <div id="language-thumb" class="lang-thumb"></div>
          </div>
        </div>
        <p id="language-empty" class="lang-empty" hidden>No matches</p>
      </section>

      <footer class="colophon">
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p>Original only</p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
